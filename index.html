<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMER大群課程活動</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f6f8; color: #333; }
        h1 { text-align: center; margin-bottom: 30px; }
        
        /* 折疊區塊設計 */
        details.activity {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            overflow: hidden;
        }
        summary {
            padding: 20px 25px;
            font-size: 1.2em;
            font-weight: bold;
            color: #5e35b1; /* 深色標題 */
            cursor: pointer;
            list-style: none;
            position: relative;
            outline: none;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after {
            content: '+';
            position: absolute;
            right: 25px;
            font-size: 1.5em;
            line-height: 1;
        }
        details[open] summary { border-bottom: 1px solid #eee; }
        details[open] summary::after { content: '-'; }

        /* 內容區塊 */
        .content { padding: 20px 25px; }
        .deadline { color: #d9534f; font-weight: bold; margin-bottom: 15px; }
        .description {
            line-height: 1.6;
            margin-bottom: 20px;
            background-color: #f2eefa; /* 柔和莫蘭迪紫 */
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #b39ddb;
        }
        .iframe-container { text-align: center; overflow: hidden; }
        iframe { max-width: 100%; border: none; }

        /* 自動適應深色模式 */
        @media (prefers-color-scheme: dark) {
            body { background-color: #121212; color: #e0e0e0; }
            details.activity { background: #1e1e1e; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
            summary { color: #b39ddb; }
            details[open] summary { border-bottom: 1px solid #333; }
            .description { background-color: #2c2538; color: #d1c4e9; border-left-color: #7e57c2; }
        }
    </style>
</head>
<body>
    <h1>SUMMER大群課程活動</h1>

        <!-- 活動1：加入 open 屬性使其預設為展開 -->
    <details class="activity" open >
        <summary>(延長報名)116年度開運手鍊</summary>
        <div class="content">
            <p class="deadline">報名時間：11/5-12：00截止</p>
            <p class="description">116年度手鍊製作場次共8場次<BR>每人限3張手鍊卦。手鏈價格：男生2100/條；女生（讀書的孩子）1900/條
<BR>報名成功後加入手鍊群組，統一將卦紙上傳到116年度手鍊LINE群組記事本或上傳連結，並在卦紙上註明場次及時間</p>
            <div class="iframe-container">
                <iframe src="https://www.beclass.com/m/showregist.php?regist_id=MzE1Mjg5NjZhY2VmMjZlNmI2OWE6U2hvd0Zvcm0=" height="894" width="700" name="beclassmainframe" id="beclassmainframe"></iframe>
            </div>
        </div>
    </details>
    
    
    
    </div>
</details>


</body>
</html>
